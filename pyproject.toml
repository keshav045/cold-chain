[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldchain-synth"
version = "1.0.0"
description = "Reproducible synthetic cold-chain (temperature/humidity excursion) data generator with validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
coldchain = "coldchain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
